<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Shortlist</title>
  <style>
    /* Archivo, vendored — a Google Fonts @import is blocked by the CSP above.
       Variable file covering 400–800 in the latin range. */
    @font-face {
      font-family: 'Archivo';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('fonts/archivo-latin.woff2') format('woff2');
    }

    /* ---------------------------------------------------------------
       Modernist tokens. Flat, single red accent, zero corner radius.
       --------------------------------------------------------------- */
    :root {
      --bg:    #f3f2f2;
      --surf:  #eae9e9;
      --ink:   #201e1d;
      --acc:   #ec3013;
      --acc7:  #ae1800;
      --div:   rgba(32, 30, 29, .4);
      --rule:  #d7d3d3;
      --dim:   #605d5d;
      --mute:  #7d7979;
      --onacc: #f3f2f2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:    #201e1d;
        --surf:  #2d2b2b;
        --ink:   #f8f4f4;
        --acc:   #ff563c;
        --acc7:  #ff9783;
        --div:   rgba(248, 244, 244, .42);
        --rule:  #444141;
        --dim:   #bab6b6;
        --mute:  #9b9797;
        --onacc: #201e1d;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }
    body {
      font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 12px;
      line-height: 1.4;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
      border-radius: 0;
    }
    button { cursor: pointer; background: none; border: none; }
    :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

    ::-webkit-scrollbar { width: 9px; }
    ::-webkit-scrollbar-thumb { background: var(--rule); }
    ::-webkit-scrollbar-thumb:hover { background: var(--mute); }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ---------------- shell ---------------- */
    #app { display: flex; flex-direction: column; height: 100%; }
    .screen { display: flex; flex-direction: column; height: 100%; min-height: 0; }
    .scroll { flex: 1; overflow-y: auto; min-height: 0; }
    .rule-t { border-top: 2px solid var(--div); }
    .rule-b { border-bottom: 2px solid var(--div); }

    /* Header: title left, controls right. */
    .hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      border-bottom: 2px solid var(--div);
      flex-shrink: 0;
    }
    .hdr-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }
    .hdr-count { color: var(--acc); }
    .hdr-right {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--mute);
      white-space: nowrap;
    }
    .hdr-actions { display: flex; gap: 6px; flex-shrink: 0; }

    /* Back link. */
    .back {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--acc);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .back:hover { color: var(--acc7); }

    /* ---------------- buttons ---------------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
      padding: 4px 7px;
      border: 1px solid var(--div);
      background: transparent;
      color: var(--ink);
      white-space: nowrap;
    }
    .btn:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
    .btn-acc {
      background: var(--acc);
      border-color: var(--acc);
      color: var(--onacc);
    }
    .btn-acc:hover { background: var(--acc7); border-color: var(--acc7); }
    .btn-lg { padding: 9px 10px; font-size: 9.5px; justify-content: flex-start; width: 100%; }
    .btn-sm { padding: 3px 6px; font-size: 8.5px; }
    .btn-danger { color: var(--acc7); }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn-ico {
      width: 20px;
      height: 20px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--div);
      color: var(--dim);
      flex-shrink: 0;
    }
    .btn-ico:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

    /* ---------------- view strip + role tabs ---------------- */
    .strip { display: flex; flex-shrink: 0; }
    .strip-cell {
      flex: 1;
      padding: 6px 2px;
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--dim);
      border-left: 1px solid var(--rule);
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .strip-cell:first-child { border-left: none; }
    .strip-cell:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
    .strip-cell.on { background: var(--acc); color: var(--onacc); }
    .strip-cell.on:hover { background: var(--acc); }

    /* Outer row never scrolls — the + stays pinned on the right while the
       tab strip inside it overflows. */
    .tabs {
      display: flex;
      align-items: stretch;
      gap: 0;
      border-top: 1px solid var(--rule);
      flex-shrink: 0;
      min-width: 0;
    }
    .tabs-scroll {
      display: flex;
      align-items: stretch;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs-scroll::-webkit-scrollbar { height: 0; }
    .tab {
      padding: 6px 9px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--dim);
      white-space: nowrap;
      border-bottom: 2px solid transparent;
    }
    .tab:hover { color: var(--ink); }
    .tab.on { color: var(--acc); border-bottom-color: var(--acc); }
    .tab-add {
      padding: 6px 9px;
      color: var(--acc);
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      border-left: 1px solid var(--rule);
    }

    /* ---------------- listing rows ---------------- */
    .band {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
      background: var(--surf);
      color: var(--dim);
    }
    .band.strong { background: var(--acc); color: var(--onacc); }
    .band:not(:first-child) { border-top: 2px solid var(--div); }

    .row {
      display: grid;
      grid-template-columns: 30px 1fr auto;
      column-gap: 9px;
      align-items: baseline;
      padding: 7px 10px;
      border-top: 1px solid var(--rule);
      cursor: pointer;
    }
    .row:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
    .row.open { background: var(--surf); }
    .row-score {
      font-size: 16px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: var(--ink);
    }
    .row-score.hi { color: var(--acc); }
    .row-score.lo { color: var(--mute); }
    .row-text { min-width: 0; }
    .row-role {
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-sub {
      font-size: 9.5px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-acts { display: flex; gap: 4px; align-self: center; }

    /* Pay. A posted figure is the employer's own and reads at full weight;
       an estimate is the board's guess and is deliberately quieter. */
    .row-pay { font-weight: 700; color: var(--ink); }
    .row-pay.est { font-weight: 400; color: var(--mute); font-style: italic; }

    .d-pay {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0 2px;
      padding: 8px 10px;
      background: var(--surf);
      border-left: 2px solid var(--ink);
    }
    .d-pay.est { border-left-color: var(--rule); }
    .d-pay-val { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
    .d-pay.est .d-pay-val { font-weight: 600; color: var(--mute); }
    .d-pay-note { font-size: 9.5px; color: var(--mute); }

    /* Expanded row detail, indented to the text column. */
    .exp {
      margin-left: 39px;
      padding: 0 10px 9px 0;
      background: var(--surf);
    }
    .bars { display: flex; flex-direction: column; gap: 4px; padding-top: 2px; }
    .bar-row {
      display: grid;
      grid-template-columns: 58px 1fr 26px;
      align-items: center;
      column-gap: 7px;
    }
    .bar-label {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--dim);
    }
    .bar { height: 3px; background: var(--rule); }
    .bar-val {
      font-size: 8.5px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: var(--dim);
    }
    .terms {
      margin-top: 7px;
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--acc7);
      line-height: 1.5;
    }
    .exp-acts { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }

    /* Pipeline strip for In Progress rows. */
    .pipe { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 2px; }
    .pipe-cell {
      font-size: 7.5px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      text-align: center;
      padding: 3px 2px;
      border: 1px solid var(--div);
      background: var(--bg);
      color: var(--dim);
    }
    .pipe-cell.on { background: var(--acc); border-color: var(--acc); color: var(--onacc); }

    /* ---------------- detail / triage shared ---------------- */
    .pad { padding: 10px; }
    .d-role { font-size: 17px; font-weight: 800; letter-spacing: -.015em; line-height: 1.2; }
    .d-company { font-size: 11.5px; color: var(--dim); margin-top: 3px; }
    .d-meta { font-size: 9.5px; color: var(--mute); margin-top: 5px; }
    .d-score {
      font-size: 32px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.02em;
      line-height: 1;
      text-align: right;
    }
    .d-score.hi { color: var(--acc); }
    .d-score.lo { color: var(--mute); }
    .d-fit {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--mute);
      text-align: right;
      margin-top: 2px;
    }
    .d-head { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
    .d-bars { margin-top: 12px; }
    .d-bars .bar { height: 4px; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .tag {
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--acc7);
      border: 1px solid var(--acc);
      padding: 3px 6px;
    }
    .tag-quiet { color: var(--dim); border-color: var(--div); }
    .desc {
      font-size: 11px;
      line-height: 1.6;
      white-space: pre-wrap;
      color: var(--ink);
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--rule);
    }
    .foot {
      flex-shrink: 0;
      border-top: 2px solid var(--div);
      padding: 7px 10px;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .foot-grid { display: flex; flex-direction: column; gap: 6px; padding: 9px 10px 10px; }
    .foot-note {
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--mute);
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    /* ---------------- triage ---------------- */
    .ticks { display: flex; gap: 3px; padding: 8px 10px 0; flex-shrink: 0; }
    .tick { flex: 1; height: 3px; background: var(--rule); }
    .tick.on { background: var(--acc); }
    .t-role { font-size: 19px; font-weight: 800; letter-spacing: -.015em; line-height: 1.15; }
    .t-company { font-size: 12px; color: var(--dim); margin-top: 3px; }
    .t-score { font-size: 44px; letter-spacing: -.03em; }

    /* ---------------- forms ---------------- */
    .field { margin-bottom: 9px; }
    .f-label {
      display: block;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 3px;
    }
    .f-input, .f-area, .f-select {
      width: 100%;
      border: 1px solid var(--div);
      background: var(--surf);
      color: var(--ink);
      padding: 6px 8px;
      font-size: 11px;
    }
    .f-area { min-height: 74px; resize: vertical; line-height: 1.5; }
    .f-input::placeholder, .f-area::placeholder { color: var(--mute); }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip {
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 4px 7px;
      border: 1px solid var(--div);
      color: var(--dim);
    }
    .chip:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
    .chip.on { background: var(--acc); border-color: var(--acc); color: var(--onacc); }
    .note { font-size: 9.5px; color: var(--mute); line-height: 1.5; }

    /* ---------------- settings ---------------- */
    .set-head {
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--dim);
      margin: 16px 0 8px;
      padding-top: 8px;
      border-top: 2px solid var(--div);
    }
    .set-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
    }
    .set-label { font-size: 11px; font-weight: 600; }
    .set-row .note { margin-top: 2px; }
    .set-num { width: 68px; flex-shrink: 0; text-align: right; }

    /* Scoring preview: what the chosen target does to the actual list. */
    .preview {
      margin: 10px 0 4px;
      padding: 9px 10px;
      background: var(--surf);
      border-left: 2px solid var(--acc);
    }
    .preview-head {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 7px;
      line-height: 1.5;
    }
    .preview-row { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; }
    .preview-score {
      font-size: 11px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      min-width: 22px;
      color: var(--acc);
    }
    .preview-score.lo { color: var(--mute); }
    .preview-role {
      font-size: 9.5px;
      color: var(--mute);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chip.swatch { display: inline-flex; align-items: center; gap: 6px; }
    .chip .dot {
      width: 9px;
      height: 9px;
      flex-shrink: 0;
      border: 1px solid var(--div);
    }
    .chip.on .dot { border-color: var(--onacc); }
    .sub-line { font-size: 9.5px; color: var(--dim); margin-top: 4px; line-height: 1.5; }

    /* ---------------- profile / import rows ---------------- */
    .chunk {
      padding: 9px 10px;
      border-top: 1px solid var(--rule);
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 7px;
      align-items: center;
    }
    .chunk-body { grid-column: 1 / -1; }
    .chunk-text {
      font-size: 10px;
      color: var(--dim);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .chunk-title {
      font-size: 11px;
      font-weight: 600;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .imp-row {
      padding: 9px 10px;
      border-top: 1px solid var(--rule);
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      cursor: pointer;
    }
    .imp-row.off { opacity: .5; }
    .box {
      width: 13px;
      height: 13px;
      border: 1px solid var(--div);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      color: transparent;
    }
    .imp-row:not(.off) .box { background: var(--acc); border-color: var(--acc); color: var(--onacc); }

    /* ---------------- undo toast ---------------- */
    .toast {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 48px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--ink);
      color: var(--bg);
      padding: 8px 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }
    .toast-label { font-size: 10px; font-weight: 600; }
    .toast-undo {
      background: none;
      border: none;
      color: var(--acc7);
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .toast-undo:hover { text-decoration: underline; }
    @media (prefers-color-scheme: dark) { .toast { color: #201e1d; } }

    /* ---------------- band bulk-dismiss ---------------- */
    .band-right { display: inline-flex; align-items: center; gap: 8px; }
    .band-x {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border: 1px solid currentColor;
      background: none;
      color: inherit;
      opacity: .55;
    }
    .band-x:hover { opacity: 1; }

    /* ---------------- follow-ups ---------------- */
    .row-due {
      font-size: 7.5px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--acc7);
      border: 1px solid var(--acc);
      padding: 1px 4px;
      margin-right: 6px;
      vertical-align: 1px;
    }

    /* ---------------- search ---------------- */
    .search-bar { padding-bottom: 10px; }

    /* ---------------- mute ---------------- */
    .detail-mute {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding: 4px 0;
      background: none;
      border: none;
      color: var(--mute);
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .detail-mute:hover { color: var(--acc7); }

    /* ---------------- duplicate detection ---------------- */
    .dup-note {
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--acc7);
      margin: 3px 0 4px;
      line-height: 1.4;
    }
    .dup-card {
      border: 1px solid var(--acc);
      padding: 9px 10px;
      margin-bottom: 8px;
    }
    .dup-head {
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--acc7);
      margin-bottom: 7px;
    }
    .dup-side {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 0;
      border-top: 1px solid var(--rule);
    }
    .dup-card .dup-note { margin-top: 7px; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--mute); }

    /* ---------------- misc ---------------- */
    .empty { color: var(--mute); font-size: 9.5px; text-align: center; padding: 40px 24px; line-height: 1.6; }
    .err {
      background: var(--acc);
      color: var(--onacc);
      font-size: 9.5px;
      font-weight: 600;
      padding: 6px 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .err-fix {
      background: var(--onacc);
      color: var(--acc);
      border: none;
      padding: 3px 8px;
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 10px; }
    .panel {
      background: var(--surf);
      border: 1px solid var(--rule);
      padding: 10px;
      font-size: 10px;
      line-height: 1.65;
      white-space: pre-wrap;
      margin-top: 10px;
    }

    /* ---------------- window chrome ---------------- */
    body.widget { border: 1px solid var(--div); }
    body.widget .hdr { -webkit-app-region: drag; }
    body.widget .hdr button, body.widget .hdr .btn { -webkit-app-region: no-drag; }
    /* Window chrome and the theme switch are app furniture, not part of the
       design language — keep them quiet so they don't compete with
       Profile/Refresh. The theme button shows in both window modes; the
       expand/hide pair is widget-only. */
    #chrome-btns { gap: 2px; }
    #chrome-btns .btn {
      border-color: transparent;
      color: var(--mute);
      padding: 4px 5px;
    }
    #chrome-btns .btn:hover { color: var(--ink); }
    #win-btns { display: none; gap: 2px; }
    body.widget #win-btns { display: flex; }

    /* Full window: same components, roomier metrics. */
    body.full { font-size: 13px; }
    body.full .pad { padding: 14px; }
    body.full .row { padding: 9px 14px; grid-template-columns: 34px 1fr auto; }
    body.full .row-role { font-size: 12.5px; }
    body.full .row-sub { font-size: 10.5px; }
    body.full .band { padding: 7px 14px; }
    body.full .hdr { padding: 9px 14px; }
    body.full .exp { margin-left: 48px; padding-right: 14px; }
    body.full .foot { padding: 9px 14px; }
    body.full .foot-grid { padding: 10px 14px 12px; }
    body.full .d-role { font-size: 19px; }
    body.full .desc { font-size: 12px; }
  </style>
</head>
