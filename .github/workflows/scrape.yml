name: Find new job listings

on:
  schedule:
    - cron: '0 */3 * * *' # every 3 hours
  workflow_dispatch: {} # manual "Run workflow" button

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: scraper
      # Reports which optional source keys actually reached the runner.
      # Prints presence and length only — never the values themselves.
      - name: Check which source keys are configured
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          for name in RAPIDAPI_KEY USAJOBS_API_KEY USAJOBS_EMAIL \
                      ADZUNA_APP_ID ADZUNA_APP_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name: SET (${#value} chars)"
            else
              echo "$name: MISSING"
            fi
          done
        continue-on-error: true
      - run: node index.js
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
